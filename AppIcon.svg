<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Rich emerald gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="50%" stop-color="#1B6B42"/>
      <stop offset="100%" stop-color="#145234"/>
    </linearGradient>

    <!-- Golden glow behind book -->
    <radialGradient id="goldenGlow" cx="50%" cy="42%" r="28%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#F0B84D" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#DAA520" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1B6B42" stop-opacity="0"/>
    </radialGradient>

    <!-- White upward light from Quran -->
    <radialGradient id="bookLight" cx="50%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FFFACD" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1B6B42" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter for sparkles -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <!-- Gold circle gradient -->
    <radialGradient id="circleGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFDF6F"/>
      <stop offset="60%" stop-color="#F0B84D"/>
      <stop offset="100%" stop-color="#D4952B"/>
    </radialGradient>

    <!-- Book page gradient left -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F0E0"/>
      <stop offset="100%" stop-color="#FFF8EC"/>
    </linearGradient>

    <!-- Book page gradient right -->
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#F0EBD8"/>
    </linearGradient>

    <!-- Rehal wood gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0724E"/>
      <stop offset="50%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#6B4226"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="0" ry="0" fill="url(#bgGrad)"/>

  <!-- Subtle geometric Islamic pattern overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1" fill="none">
    <!-- Repeating diamond/star pattern -->
    <path d="M512 80 L572 140 L512 200 L452 140 Z"/>
    <path d="M312 180 L372 240 L312 300 L252 240 Z"/>
    <path d="M712 180 L772 240 L712 300 L652 240 Z"/>
    <path d="M112 280 L172 340 L112 400 L52 340 Z"/>
    <path d="M912 280 L972 340 L912 400 L852 340 Z"/>
    <path d="M212 380 L272 440 L212 500 L152 440 Z"/>
    <path d="M812 380 L872 440 L812 500 L752 440 Z"/>
    <path d="M112 580 L172 640 L112 700 L52 640 Z"/>
    <path d="M912 580 L972 640 L912 700 L852 640 Z"/>
    <path d="M312 680 L372 740 L312 800 L252 740 Z"/>
    <path d="M712 680 L772 740 L712 800 L652 740 Z"/>
    <path d="M512 780 L572 840 L512 900 L452 840 Z"/>
    <!-- Connecting lines -->
    <circle cx="512" cy="140" r="30" />
    <circle cx="312" cy="240" r="30" />
    <circle cx="712" cy="240" r="30" />
    <circle cx="212" cy="440" r="30" />
    <circle cx="812" cy="440" r="30" />
    <circle cx="112" cy="640" r="30" />
    <circle cx="912" cy="640" r="30" />
  </g>

  <!-- Golden circle backdrop -->
  <circle cx="512" cy="400" r="260" fill="url(#circleGrad)" opacity="0.9"/>
  <!-- Inner ring on gold circle -->
  <circle cx="512" cy="400" r="248" fill="none" stroke="#D4952B" stroke-width="2" opacity="0.4"/>
  <circle cx="512" cy="400" r="255" fill="none" stroke="#FFE89F" stroke-width="1.5" opacity="0.3"/>

  <!-- Decorative scalloped border on gold circle -->
  <g opacity="0.2" fill="none" stroke="#8B5E3C" stroke-width="1.5">
    <circle cx="512" cy="400" r="240"/>
    <!-- Small decorative arcs around the circle -->
    <circle cx="512" cy="148" r="8"/>
    <circle cx="622" cy="162" r="8"/>
    <circle cx="716" cy="210" r="8"/>
    <circle cx="402" cy="162" r="8"/>
    <circle cx="308" cy="210" r="8"/>
    <circle cx="760" cy="290" r="8"/>
    <circle cx="264" cy="290" r="8"/>
    <circle cx="772" cy="400" r="8"/>
    <circle cx="252" cy="400" r="8"/>
    <circle cx="760" cy="510" r="8"/>
    <circle cx="264" cy="510" r="8"/>
    <circle cx="716" cy="590" r="8"/>
    <circle cx="308" cy="590" r="8"/>
    <circle cx="622" cy="638" r="8"/>
    <circle cx="402" cy="638" r="8"/>
    <circle cx="512" cy="652" r="8"/>
  </g>

  <!-- Golden glow from book -->
  <ellipse cx="512" cy="430" rx="300" ry="280" fill="url(#goldenGlow)"/>

  <!-- White light emanating upward -->
  <ellipse cx="512" cy="380" rx="180" ry="250" fill="url(#bookLight)"/>

  <!-- Rehal (book stand) -->
  <g filter="url(#dropShadow)">
    <!-- Left leg -->
    <path d="M380 580 L340 720 Q335 735 350 738 L370 738 Q382 738 385 725 L420 600 Z"
          fill="url(#woodGrad)" stroke="#5A3520" stroke-width="2"/>
    <!-- Right leg -->
    <path d="M644 580 L684 720 Q689 735 674 738 L654 738 Q642 738 639 725 L604 600 Z"
          fill="url(#woodGrad)" stroke="#5A3520" stroke-width="2"/>
    <!-- Cross beam -->
    <path d="M370 650 L654 650 Q660 650 658 644 L656 638 Q654 632 648 632 L376 632 Q370 632 368 638 L366 644 Q364 650 370 650 Z"
          fill="#7A4E30" stroke="#5A3520" stroke-width="1.5"/>
    <!-- Top support left -->
    <path d="M360 575 L420 575 L430 590 L350 590 Z"
          fill="#8B5E3C" stroke="#5A3520" stroke-width="1.5"/>
    <!-- Top support right -->
    <path d="M604 575 L664 575 L674 590 L594 590 Z"
          fill="#8B5E3C" stroke="#5A3520" stroke-width="1.5"/>
  </g>

  <!-- Open Quran book -->
  <g filter="url(#dropShadow)">
    <!-- Book cover/binding -->
    <path d="M300 410 L300 560 Q300 575 315 575 L512 580 L709 575 Q724 575 724 560 L724 410 Q724 395 710 392 L520 380 L512 380 L504 380 L314 392 Q300 395 300 410 Z"
          fill="#3D6B5E" stroke="#2A4D42" stroke-width="2"/>

    <!-- Left page -->
    <path d="M512 390 Q510 385 470 380 L330 370 Q312 368 310 385 L308 545 Q308 562 326 564 L475 572 Q512 575 512 560 Z"
          fill="url(#pageLeft)" stroke="#D4C9A8" stroke-width="1"/>

    <!-- Right page -->
    <path d="M512 390 Q514 385 554 380 L694 370 Q712 368 714 385 L716 545 Q716 562 698 564 L549 572 Q512 575 512 560 Z"
          fill="url(#pageRight)" stroke="#D4C9A8" stroke-width="1"/>

    <!-- Center spine shadow -->
    <line x1="512" y1="388" x2="512" y2="562" stroke="#C4B896" stroke-width="3" opacity="0.5"/>
    <line x1="511" y1="388" x2="511" y2="562" stroke="#E8DCC0" stroke-width="1" opacity="0.4"/>

    <!-- Arabic-style text lines on left page -->
    <line x1="350" y1="410" x2="485" y2="405" stroke="#B8A87A" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="345" y1="435" x2="490" y2="430" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="340" y1="458" x2="492" y2="454" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="338" y1="482" x2="494" y2="478" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="336" y1="505" x2="495" y2="502" stroke="#B8A87A" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
    <line x1="360" y1="528" x2="480" y2="525" stroke="#B8A87A" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

    <!-- Arabic-style text lines on right page -->
    <line x1="539" y1="405" x2="674" y2="410" stroke="#B8A87A" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="534" y1="430" x2="679" y2="435" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="532" y1="454" x2="684" y2="458" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="530" y1="478" x2="686" y2="482" stroke="#B8A87A" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="529" y1="502" x2="688" y2="505" stroke="#B8A87A" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
    <line x1="544" y1="525" x2="664" y2="528" stroke="#B8A87A" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Sparkle/star accents suggesting spiritual energy -->
  <!-- Large sparkle top center -->
  <g opacity="0.8">
    <line x1="512" y1="240" x2="512" y2="280" stroke="#FFE89F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="492" y1="260" x2="532" y2="260" stroke="#FFE89F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="498" y1="246" x2="526" y2="274" stroke="#FFE89F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="526" y1="246" x2="498" y2="274" stroke="#FFE89F" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Glow behind main sparkle -->
  <circle cx="512" cy="260" r="18" fill="#FFE89F" opacity="0.15" filter="url(#sparkleGlow)"/>

  <!-- Small sparkle left -->
  <g opacity="0.55">
    <line x1="350" y1="280" x2="350" y2="300" stroke="#FFE89F" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="290" x2="360" y2="290" stroke="#FFE89F" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="350" cy="290" r="10" fill="#FFE89F" opacity="0.1" filter="url(#sparkleGlow)"/>

  <!-- Small sparkle right -->
  <g opacity="0.55">
    <line x1="674" y1="280" x2="674" y2="300" stroke="#FFE89F" stroke-width="2" stroke-linecap="round"/>
    <line x1="664" y1="290" x2="684" y2="290" stroke="#FFE89F" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="674" cy="290" r="10" fill="#FFE89F" opacity="0.1" filter="url(#sparkleGlow)"/>

  <!-- Tiny sparkle dots -->
  <circle cx="420" cy="250" r="3" fill="#FFE89F" opacity="0.5"/>
  <circle cx="604" cy="250" r="3" fill="#FFE89F" opacity="0.5"/>
  <circle cx="460" cy="220" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="564" cy="220" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="380" cy="320" r="2.5" fill="#FFE89F" opacity="0.35"/>
  <circle cx="644" cy="320" r="2.5" fill="#FFE89F" opacity="0.35"/>

  <!-- App name text -->
  <text x="512" y="830" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#FFE89F" opacity="0.95" letter-spacing="8">RUQYAH</text>
  <text x="512" y="890" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#FFE89F" opacity="0.65" letter-spacing="14">SYAR'IYYAH</text>
</svg>